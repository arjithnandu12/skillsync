services:
  # Backend API Web Service
  - type: web
    name: skillsync-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false

  # Frontend Static Site
  - type: web
    name: skillsync-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://skillsync-backend-0lfd.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
